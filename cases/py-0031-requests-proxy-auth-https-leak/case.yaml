id: py-0031-requests-proxy-auth-https-leak
title: Proxy-Authorization added to redirected requests even when they tunnel over HTTPS
language: python
difficulty: hard
tags:
- security
- credentials
- http
- proxy
- cve
source:
  kind: cve
  ref: https://github.com/psf/requests/commit/74ea7cf7a6a27a4eeb2ae24e162bcc942a6706d5
  license: Apache-2.0
  cve: CVE-2023-32681
  advisory: GHSA-j8r2-6x86-q33q
  fixed_in: requests 2.31.0
  notes: pr.diff is the fix's change to requests/sessions.py, reversed. repo/ holds lines 1-40, 106-160 and 283-356
    (redirect handling) of the file at the fix commit.
bugs:
- file: requests/sessions.py
  lines:
  - 142
  - 143
  class: credential_leak
  cwe: CWE-200
  severity: medium
  description: rebuild_proxies sets Proxy-Authorization on the request itself even for https:// destinations. Those
    go through a CONNECT tunnel, so the header is sent inside TLS to the destination server and leaks the proxy
    credentials to it.
