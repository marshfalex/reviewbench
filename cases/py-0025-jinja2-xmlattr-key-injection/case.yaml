id: py-0025-jinja2-xmlattr-key-injection
title: xmlattr filter accepts attribute keys containing spaces
language: python
difficulty: hard
tags:
- security
- xss
- templating
- cve
source:
  kind: cve
  ref: https://github.com/pallets/jinja/commit/7dd3680e6eea0d77fde024763657aa4d884ddb23
  license: BSD-3-Clause
  cve: CVE-2024-22195
  advisory: GHSA-h5c8-rqwp-cp95
  fixed_in: Jinja2 3.1.3
  notes: pr.diff is the fix's change to src/jinja2/filters.py, reversed. repo/ holds lines 1-30 (imports) and 221-305
    (do_items, do_xmlattr) of the file at the fix commit.
bugs:
- file: src/jinja2/filters.py
  lines:
  - 88
  - 92
  class: attribute_injection
  cwe: CWE-79
  severity: medium
  description: Keys are only HTML-escaped, and escaping does not touch spaces or '=', so a user-controlled key like
    'onclick=alert(1) x' injects extra attributes (XSS) into the rendered tag.
