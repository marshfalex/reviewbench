[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewbench"
version = "0.1.0"
description = "An open benchmark for AI pull-request reviewers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
reviewbench = "reviewbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
# cases/ contains intentionally buggy code under review; never lint it.
extend-exclude = ["cases", "heldout"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["cases", "heldout", "results"]
