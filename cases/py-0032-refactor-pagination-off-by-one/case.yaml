  license: MIT
bugs:
- file: app/listing.py
  lines: [26, 30]
  class: off_by_one_pagination
  cwe: CWE-193
  severity: medium
  description: Pages are 1-based (parse_page never returns less than 1), but the refactored
    paginate computes offset = page * size instead of (page - 1) * size, so page 1 shows the second
    page and the first page of results can never be fetched.
